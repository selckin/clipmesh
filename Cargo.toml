[package]
name = "clipmesh"
version = "0.1.0"
edition = "2021"
# zbus 5.14+ (the Mutter clipboard backend) requires 1.87.
rust-version = "1.87"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bincode = "1.3"
blake3 = "1"
indexmap = { version = "2", features = ["serde"] }
inotify = { version = "0.11.2", default-features = false }
rand = "0.8"
# "rc": lets `Arc<Offer>` cross the wire by serializing the pointee, so a
# clipboard payload can be shared in memory without a copy on the way to the
# encoder. Wire-identical to serializing the `Offer` directly.
serde = { version = "1", features = ["derive", "rc"] }
shellexpand = "3"
snow = "0.9"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"
# The Mutter clipboard backend (GNOME) talks D-Bus; tokio transport only, no
# async-io runtime alongside tokio's.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# StreamExt/FutureExt for the D-Bus signal streams (zbus re-exports only
# futures-core).
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
# p2p: the Mutter backend's tests host a fake Mutter over a socketpair, with
# no bus daemon; production builds don't carry the feature.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
tokio = { version = "1", features = ["full", "test-util"] }
